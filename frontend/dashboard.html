<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

  <div class="chat-container">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-header">
        <h3>Chats</h3>
        <button id="open-group-modal">+ New Group</button>
      </div>
      <div style="padding: 10px;">
        <input type="text" id="user-search" placeholder="Search users..." style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc;">
      </div>
      <div class="chat-list" id="chat-list"></div>
    </div>

    <!-- Chat Window -->
    <div class="chat-window">
      <div class="chat-header" id="chat-header">Select a chat to start messaging</div>
      <div class="messages-container" id="messages-container"></div>
      <div class="typing-indicator" id="typing-indicator">Someone is typing...</div>
      
      <form class="message-input-container" id="message-form">
        <input type="file" id="file-input" style="display: none;">
        <label for="file-input" style="cursor: pointer; font-size: 20px;">📎</label>
        <input type="text" id="message-input" placeholder="Type a message...">
        <button type="submit" style="padding: 8px 16px; border-radius: 20px; border: none; background: #0084ff; color: white; cursor: pointer;">Send</button>
      </form>
    </div>
  </div>

  <!-- Create Group Modal -->
  <div class="modal-overlay hidden" id="group-modal">
    <div class="modal-content">
      <h3>Create Group Chat</h3>
      <input type="text" id="group-name" placeholder="Group Name">
      <input type="text" id="group-search" placeholder="Add users...">
      <div id="group-selected-users" style="font-size: 12px; color: #555;">Selected: </div>
      <div id="group-search-results" style="max-height: 100px; overflow-y: auto;"></div>
      <button id="create-group-btn" style="background: #0084ff; color: white; padding: 8px; border: none; border-radius: 4px; cursor: pointer;">Create</button>
      <button id="close-group-btn" style="background: #ccc; padding: 8px; border: none; border-radius: 4px; cursor: pointer;">Cancel</button>
    </div>
  </div>

  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
