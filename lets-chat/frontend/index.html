<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat App - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="auth-container">
    <!-- Login Form -->
    <form id="login-form" class="auth-form">
      <h2>Login</h2>
      <p id="auth-error" style="color: red; display: none;"></p>
      <input type="email" id="login-email" placeholder="Email" required>
      <input type="password" id="login-password" placeholder="Password" required>
      <button type="submit">Login</button>
      <p style="text-align: center; font-size: 14px;">
        Need an account? <a href="#" id="show-register">Register</a>
      </p>
    </form>

    <!-- Register Form -->
    <form id="register-form" class="auth-form" style="display: none;">
      <h2>Register</h2>
      <div class="avatar-picker">
        <img id="reg-avatar-preview" class="avatar-img avatar-preview" src="" alt="">
        <label for="reg-avatar" class="avatar-picker-label">Choose profile picture (optional)</label>
        <input type="file" id="reg-avatar" accept="image/*">
      </div>
      <input type="text" id="reg-username" placeholder="Username" required>
      <input type="email" id="reg-email" placeholder="Email" required>
      <input type="password" id="reg-password" placeholder="Password" required>
      <button type="submit">Register</button>
      <p style="text-align: center; font-size: 14px;">
        Already have an account? <a href="#" id="show-login">Login</a>
      </p>
    </form>
  </div>

  <script src="api.js"></script>
  <script>
    const loginForm = document.getElementById('login-form');
    const registerForm = document.getElementById('register-form');
    const errorText = document.getElementById('auth-error');

    document.getElementById('show-register').addEventListener('click', (e) => {
      e.preventDefault();
      loginForm.style.display = 'none';
      registerForm.style.display = 'flex';
    });

    document.getElementById('show-login').addEventListener('click', (e) => {
      e.preventDefault();
      registerForm.style.display = 'none';
      loginForm.style.display = 'flex';
    });

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const data = await apiRequest('/auth/login', 'POST', {
          email: document.getElementById('login-email').value,
          password: document.getElementById('login-password').value
        });
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        window.location.href = 'dashboard.html';
      } catch (err) {
        errorText.innerText = err.message;
        errorText.style.display = 'block';
      }
    });

    const regAvatarInput = document.getElementById('reg-avatar');
    const regAvatarPreview = document.getElementById('reg-avatar-preview');
    regAvatarInput.addEventListener('change', () => {
      const file = regAvatarInput.files[0];
      if (!file) {
        regAvatarPreview.style.display = 'none';
        return;
      }
      regAvatarPreview.src = URL.createObjectURL(file);
      regAvatarPreview.style.display = 'block';
    });

    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const formData = new FormData();
        formData.append('username', document.getElementById('reg-username').value);
        formData.append('email', document.getElementById('reg-email').value);
        formData.append('password', document.getElementById('reg-password').value);
        if (regAvatarInput.files[0]) formData.append('avatar', regAvatarInput.files[0]);

        const data = await apiRequest('/auth/register', 'POST', formData, true);
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        window.location.href = 'dashboard.html';
      } catch (err) {
        alert(err.message);
      }
    });
  </script>
</body>
</html>
